services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oracle_test
      POSTGRES_PASSWORD: oracle_test
      POSTGRES_DB: oracle_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle_test -d oracle_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    tmpfs:
      - /data
